<body class="bg-body-tertiary">

     <aside class="offcanvas-ig offcanvasd-start sidebar" tabindex="1" id="menuLateral" aria-labelledby="tituloMenu">

        <h5 class="offcanvas-title" id="tituloMenu"><i class="bi bi-shop" me-2></i>Tienda sena</h5>

        data-bs-dismiss="offcanvas"

        arial-label="cerrar menu"></button>
        <!--cierre en encabezado movil-->
        </div>
        <!-- cuerpo del menu flexbox en columna para aplicar logo enlaxces y boton de salida-->
         <div class="offcanvas-body d-flex-colum p-3">

            </div>
