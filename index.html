<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion Inventario ADSO</title>
    <!--css de botsrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria de iconos de Bootstrap--> 
    <link href="http://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados -->
</head>
<body class="login-fondo">

    <main class="login-card"><!--contenido principal de la pagina-->
        <header class="login-encabezado"><!--encabezado del login-->
            <!--icono de la tienda-->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">Inventario Sena</h1>
            <p class="text-secundary mb-0">Ingresa tus credenciales para continuar</p>

        </header>

        <form action="dashboard.html" method="get"></form>
        <!--form permite contenido de un formulario cuando se envia nos lleva a la ruta method nos envia la informacion con get-->
        <div class="form-floating mb-3"><!--permite agrupar un contenido en un contenedor-->
            
            <input type="email" class="form-control" id="correo" placeholder="sena@correo.com"required><!--type obliga que tenga el @, placeholder es el texto del ejemplo required es un campo obligatorio-->
            <label for="correo"><i class="bi bi-envelope me-1"></i>Correo electronico</label><!--etiqueta de texto que con el for conecta con el input-->


        </div>
        <div class="form-floating md-3">
        <input type="password" class="form-control" id="clave" placeholder="minimo 6 caracteres" minilength="6" required>
        <label for="clave"><i class="bi bi-lock me-1"></i> Contraseña</label> 
        <!--type=pasword oculta lo que escribes, minlenght exige al menos 6 caracteres-->
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check"
            <input class="form-check-input" type="checkbox" id="recordar">
            <label class="form-check-label" for="recordar">recordarme</label>
        </div>
        <a href="#" class="small text-decoration-none"> ¿olvido su contraseña?</a> 
    </div>
        <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar</button><!--envia el formulario antes revisa los campos required email y minlengt-->
    </form><!--cierra el formulario-->

    <p class="login-pie">¿No tienes cuenta?<a href="registro.html" class="text-decoration-none">registrate</a> </p>
    <footer class="login-pie"> 2026 SENA - ADSO Mixto</footer><!--pie de pagina-->


    </main>
    
</body>
</html>
